[package]
name = "launcher-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Catálogo assinado e gerenciamento de aplicativos do Struct Launcher"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
dunce = "1"
ed25519-dalek = "2"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
sysinfo = "0.33"

[dev-dependencies]
tiny_http = "0.12"
