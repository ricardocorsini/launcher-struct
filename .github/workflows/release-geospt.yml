name: Build or publish GeoSPT
on:
  push:
    branches: [master]
    paths: [.github/geospt-release-request.json]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Versão, por exemplo v2.0.7'
        type: string
        required: true
      commit:
        description: 'SHA completo do código GeoSPT'
        type: string
        required: true
      publish:
        description: 'Publicar pacotes assinados; exige a tag preparada no repositório original'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: geospt-${{ github.ref }}
  cancel-in-progress: false
jobs:
  request:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.request.outputs.tag }}
      commit: ${{ steps.request.outputs.commit }}
      publish: ${{ steps.request.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: node --test scripts/distribution/geospt-request.test.mjs
      - id: request
        run: node scripts/geospt-release-request.mjs
        env:
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
          RELEASE_INPUT_COMMIT: ${{ inputs.commit }}
          RELEASE_INPUT_PUBLISH: ${{ inputs.publish }}
  preview:
    needs: request
    if: needs.request.outputs.publish == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
            platform: linux-x64
          - os: windows-latest
            bundles: nsis
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: itanervale/GEOSPT-STRUCT
          ref: ${{ needs.request.outputs.commit }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .launcher-tools
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
      - name: Verify source version and application identity
        run: node .launcher-tools/scripts/geospt-release-request.mjs --verify-source
        env:
          RELEASE_INPUT_TAG: ${{ needs.request.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run check
      - run: npm run test:core
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: npm run desktop:build -- --bundles ${{ matrix.bundles }} -- --locked
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GeoSPT-${{ needs.request.outputs.tag }}-${{ needs.request.outputs.commit }}-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
  release:
    needs: request
    if: needs.request.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ricardocorsini/openstruct-catalog/.github/workflows/release-product.yml@14ad779bec9060e8169ce4d4f511f1124645661c
    with:
      product-id: geosptstruct
      tag: ${{ needs.request.outputs.tag }}
      source-repository: itanervale/GEOSPT-STRUCT
      source-commit: ${{ needs.request.outputs.commit }}
      distribution-repo: ricardocorsini/openstruct-catalog
      tooling-ref: 14ad779bec9060e8169ce4d4f511f1124645661c
    secrets:
      package-signing-key: ${{ secrets.OPENSTRUCT_PACKAGE_KEY }}
      distribution-token: ${{ secrets.OPENSTRUCT_DISTRIBUTION_TOKEN }}
